name: Update Schedule

on:
  schedule:
    - cron: "0 6 * * *"   # запуск каждый день в 9:00 по Москве
  workflow_dispatch:      # возможность запустить вручную

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run schedule parser
      run: python parse_schedule.py

    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

        # Получаем последнюю версию ветки main
        git fetch origin main
        git checkout main
        git reset --soft origin/main

        # Добавляем дату и время к коммиту
        DATE=$(date +"%Y-%m-%d %H:%M")

        git add schedule.json
        git commit -m "Update schedule.json (auto) — ${DATE}" || echo "No changes to commit"

        # Подтягиваем новые изменения и пушим принудительно
        git pull --rebase origin main || echo "No rebase needed"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main --force

