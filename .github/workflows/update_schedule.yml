name: Update Schedule

on:
  schedule:
    - cron: "0 6 * * *"   # запуск каждый день в 9:00 по Москве
  workflow_dispatch:      # возможность запустить вручную

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run schedule parser
      run: python parse_schedule.py

    - name: Commit and push updated schedule.json
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add schedule.json
        git commit -m "Update schedule.json (auto)" || echo "No changes to commit"
        git push
