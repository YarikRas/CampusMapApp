name: Update Schedule (Selenium)

on:
  schedule:
    - cron: "0 */6 * * *"  # запуск каждые 6 часов
  workflow_dispatch:       # можно запустить вручную

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🧰 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 webdriver-manager

      - name: 🧠 Run Selenium parser
        run: |
          python parse_schedule_selenium.py

      - name: ⚙️ Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git pull --rebase
          git add schedule.json
          git commit -m "Update schedule.json (auto via Selenium)" || echo "No changes"
          git push
