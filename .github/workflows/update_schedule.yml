name: 🕒 Update Schedule (every 30 min)

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут
  workflow_dispatch:          # возможность вручную запустить

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: 🧩 Install Chrome and Chromedriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          # Получаем major-версию Chrome (e.g., 141)
          CHROME_MAJOR=$(google-chrome --version | cut -d ' ' -f3 | cut -d '.' -f1)
          echo "Chrome major version: $CHROME_MAJOR"
          
          # Скачиваем matching chromedriver (LATEST_RELEASE_{major})
          CHROMEDRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/${CHROMEDRIVER_MAJOR}/linux64/chromedriver-linux64.zip"
          wait, подожди — в 2023+ Google переехал на chrome-for-testing-public (старый chromedriver.storage устарел для новых версий).
          
          # Правильный способ для 2025 (chrome-for-testing):
          CHROME_VERSION=$(google-chrome --version | sed -E 's/.* ([0-9]+)(\.[0-9]+){3}.*/\1.\2.\3.\4/' | cut -d. -f1-3)  # e.g., 141.0.7390
          echo "Full Chrome version: $CHROME_VERSION"
          
          # Скачиваем chromedriver для exact версии (или closest)
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          rm -rf chromedriver-linux64.zip chromedriver-linux64
          
          # Проверяем версии
          chromedriver --version
          google-chrome --version

      - name: 🧠 Run schedule parser
        run: python parse_all_schedules.py

      - name: 💾 Commit & Push results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git pull --rebase origin main || true
          git add schedule.json
          git commit -m "🔄 Update schedule.json (auto)" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} main
