name: 🕒 Update Schedule (every 30 min)

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут
  workflow_dispatch:          # возможность вручную запустить

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: 🧩 Setup Chrome and Chromedriver
        uses: nanasess/setup-chromedriver@v2  # Или browser-actions/setup-chrome@v1
        with:
          chromedriver-version: stable  # Авто-match с Chrome

      - name: 🔧 Update PATH
        run: echo "/opt/hostedtoolcache/chromedriver/stable/x64" >> $GITHUB_PATH

      - name: 🧠 Run schedule parser
        run: python parse_all_schedules.py

      - name: 💾 Commit & Push results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git pull --rebase origin main || true
          git add schedule.json
          git commit -m "🔄 Update schedule.json (auto)" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} main
